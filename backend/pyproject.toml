[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "clicksupply"
version = "0.1.0"
description = "Enterprise AEO/GEO platform for the Indian market"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.18",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.0",
    "greenlet>=3.0.0",
    "github-copilot-sdk>=0.2.0",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.49.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
